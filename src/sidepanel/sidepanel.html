<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Rules Overlay</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #1b1523;
    color: #f1ecfb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #panel {
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  #search-input {
    box-sizing: border-box;
    width: 100%;
    padding: 14px 16px;
    font-size: 15px;
    font-family: inherit;
    background: #241a30;
    color: #f1ecfb;
    border: none;
    border-bottom: 1px solid #3c2f52;
    outline: none;
    flex-shrink: 0;
  }
  #search-input::placeholder { color: #8f7fa8; }
  #body { flex: 1; overflow-y: auto; min-height: 0; }
  .results { list-style: none; margin: 0; padding: 6px; }
  .result {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
  }
  .result.selected { background: #3a2a52; }
  .result-title { font-size: 14px; font-weight: 600; }
  .result-category {
    font-size: 10.5px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #a894c4;
    white-space: nowrap;
  }
  .empty, .hint { padding: 20px 16px; color: #a894c4; font-size: 13.5px; }
  .detail-view { padding: 16px 18px 20px; }
  .back-button {
    all: unset;
    cursor: pointer;
    color: #b9a4dd;
    font-size: 13px;
    margin-bottom: 10px;
    display: inline-block;
  }
  .back-button:hover { color: #f1ecfb; }
  .detail-heading { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .detail-heading h2 { all: unset; font-size: 17px; font-weight: 700; }
  .detail-body { font-size: 14px; line-height: 1.55; white-space: pre-wrap; color: #e6ddf5; }
  .see-also { margin-top: 14px; padding-top: 12px; border-top: 1px solid #3c2f52; font-size: 12.5px; color: #a894c4; }
  .see-also-link { all: unset; cursor: pointer; color: #c9b6ee; text-decoration: underline; }
  .see-also-link:hover { color: #f1ecfb; }
  #footer {
    padding: 8px 14px;
    font-size: 10px;
    line-height: 1.4;
    color: #6f5f8a;
    border-top: 1px solid #2c2238;
    background: #17111f;
    flex-shrink: 0;
  }
</style>
</head>
<body>
  <div id="panel">
    <input id="search-input" type="text" placeholder="Search rules…" autocomplete="off" spellcheck="false" />
    <div id="body"></div>
    <div id="footer">
      This work includes material from the D&D System Reference Document 5.1, © Wizards of the Coast LLC, available under the Creative Commons Attribution 4.0 International License.
    </div>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
