<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Rules Overlay — Options</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #1b1523;
    color: #f1ecfb;
    max-width: 480px;
    margin: 48px auto;
    padding: 0 20px;
  }
  h1 { font-size: 20px; }
  p { line-height: 1.5; color: #d9cfec; }
  #shortcut-status {
    font-size: 15px;
    font-weight: 600;
    padding: 10px 14px;
    border-radius: 8px;
    background: #241a30;
    border: 1px solid #3c2f52;
  }
  #shortcut-status.unset {
    color: #f3b6b6;
    border-color: #6a3a3a;
  }
  button {
    margin-top: 16px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    color: #1b1523;
    background: #c9b6ee;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  button:hover { background: #d9c9f7; }
  .hint { font-size: 13px; color: #a894c4; }
</style>
</head>
<body>
  <h1>Rules Overlay for D&D 5e</h1>
  <p id="shortcut-status">Checking current shortcut…</p>
  <button id="open-shortcuts" type="button">Open Chrome's keyboard shortcut settings</button>
  <p class="hint">
    Chrome doesn't let an extension set its own hotkey directly. The button
    above opens Chrome's own shortcuts page, where you can assign or change
    the binding for "Open/close the rules overlay."
  </p>
  <script src="options.js"></script>
</body>
</html>
